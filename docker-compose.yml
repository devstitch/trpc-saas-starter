version: "3.8"

services:
  # MongoDB service
  mongodb:
    image: mongo:7-alpine
    container_name: trpc-saas-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - trpc-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trpc-saas-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mongodb://admin:password@mongodb:27017/trpc-saas?authSource=admin"
      JWT_SECRET: "your-secret-key-change-in-production"
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - trpc-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/trpc/health.check",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:

networks:
  trpc-network:
    driver: bridge
